  /v9/technologies/lookup:
    post:
      tags:
      - technologies
      summary: Look up technologies by name, slug, or alias
      operationId: lookup_technologies__api_version__technologies_lookup_post
      security:
      - api_token: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupTechnologiesRequest'
            examples:
              filters:
                summary: Look up bigquery and windows-azure
                value:
                  technologies:
                  - bigquery
                  - windows-azure
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupTechnologiesResponse'
              example:
                id: 019c2a87-11f0-78b3-b82d-cdd178cf4018
                credits_used: 1
                credits_remaining: 999
                matched_count: 2
                results:
                - input: bigquery
                  technology:
                    id: 176
                    slug: gcp-bigquery
                    name: GCP BigQuery
                    categories:
                    - slug: cloud-data-warehouse
                      name: Cloud Data Warehouse
                      name_short: Warehouse
                    - slug: modern-data-platform
                      name: Modern Data Platform
                      name_short: Modern Data
                    - slug: olap
                      name: OLAP
                      name_short: OLAP
                - input: windows-azure
                  technology:
                    id: 9
                    slug: azure
                    name: Azure
                    categories:
                    - slug: cloud-vendor
                      name: Cloud Vendor
                      name_short: Cloud
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v9/technologies/categories/lookup:
    post:
      tags:
      - technologies
      summary: Look up technology categories by slug or name
      operationId: lookup_technology_categories__api_version__technologies_categories_lookup_post
      security:
      - api_token: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupTechnologyCategoriesRequest'
            examples:
              filters:
                summary: Look up the cloud vendor category
                value:
                  technology_categories:
                  - cloud-vendor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupTechnologyCategoriesResponse'
              example:
                id: 019c2a87-11f0-78b3-b82d-cdd178cf4018
                credits_used: 1
                credits_remaining: 999
                matched_count: 1
                results:
                - input: cloud-vendor
                  category:
                    slug: cloud-vendor
                    name: Cloud Vendor
                    name_short: Cloud
                    technologies:
                    - id: 6
                      slug: aws
                      name: AWS
                    - id: 9
                      slug: azure
                      name: Azure
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    app__schemas__paid_api__technologies__GetTechnologiesResponse__TechDetails:
      properties:
        slug:
          type: string
          title: Slug
        name:
          type: string
          title: Name
        count:
          type: integer
          title: Count
      type: object
      required:
      - slug
      - name
      - count
      title: TechDetails
    LookupTechnologyCategoriesResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        credits_used:
          type: integer
          title: Credits Used
        credits_remaining:
          type: integer
          title: Credits Remaining
        matched_count:
          type: integer
          title: Matched Count
        results:
          items:
            $ref: '#/components/schemas/app__schemas__paid_api__technologies__LookupTechnologyCategoriesResponse__LookupResult'
          type: array
          title: Results
      type: object
      required:
      - id
      - credits_used
      - credits_remaining
      - matched_count
      - results
      title: LookupTechnologyCategoriesResponse
    LookupTechnologyCategoriesRequest:
      properties:
        technology_categories:
          items:
            type: string
          type: array
          maxItems: 1000
          minItems: 1
          title: Technology Categories
          description: List of technology category slugs or names to look up
      type: object
      required:
      - technology_categories
      title: LookupTechnologyCategoriesRequest
    Technology:
      properties:
        id:
          type: integer
          title: Id
        slug:
          type: string
          title: Slug
        name:
          type: string
          title: Name
      type: object
      required:
      - id
      - slug
      - name
      title: Technology
    app__schemas__paid_api__technologies__LookupTechnologiesResponse__TechDetails:
      properties:
        id:
          type: integer
          title: Id
        slug:
          type: string
          title: Slug
        name:
          type: string
          title: Name
        categories:
          items:
            $ref: '#/components/schemas/TechCategory'
          type: array
          title: Categories
      type: object
      required:
      - id
      - slug
      - name
      - categories
      title: TechDetails
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    app__schemas__paid_api__technologies__LookupTechnologiesResponse__LookupResult:
      properties:
        input:
          type: string
          title: Input
        technology:
          anyOf:
          - $ref: '#/components/schemas/app__schemas__paid_api__technologies__LookupTechnologiesResponse__TechDetails'
          - type: 'null'
      type: object
      required:
      - input
      - technology
      title: LookupResult
    LookupTechnologiesRequest:
      properties:
        technologies:
          items:
            type: string
          type: array
          maxItems: 1000
          minItems: 1
          title: Technologies
          description: List of technology names, slugs, or aliases to look up
      type: object
      required:
      - technologies
      title: LookupTechnologiesRequest
    LookupTechnologiesResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        credits_used:
          type: integer
          title: Credits Used
        credits_remaining:
          type: integer
          title: Credits Remaining
        matched_count:
          type: integer
          title: Matched Count
        results:
          items:
            $ref: '#/components/schemas/app__schemas__paid_api__technologies__LookupTechnologiesResponse__LookupResult'
          type: array
          title: Results
      type: object
      required:
      - id
      - credits_used
      - credits_remaining
      - matched_count
      - results
      title: LookupTechnologiesResponse
    TechCategory:
      properties:
        slug:
          type: string
          title: Slug
        name:
          type: string
          title: Name
        name_short:
          type: string
          title: Name Short
      type: object
      required:
      - slug
      - name
      - name_short
      title: TechCategory
    app__schemas__paid_api__technologies__LookupTechnologyCategoriesResponse__LookupResult:
      properties:
        input:
          type: string
          title: Input
        category:
          anyOf:
          - $ref: '#/components/schemas/CategoryDetails'
          - type: 'null'
      type: object
      required:
      - input
      - category
      title: LookupResult
    GetTechnologiesRequest:
      properties:
        query:
          type: string
          title: Query
      type: object
      required:
      - query
      title: GetTechnologiesRequest
    GetTechnologiesResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        credits_used:
          type: integer
          title: Credits Used
        credits_remaining:
          type: integer
          title: Credits Remaining
        technologies:
          items:
            $ref: '#/components/schemas/app__schemas__paid_api__technologies__GetTechnologiesResponse__TechDetails'
          type: array
          title: Technologies
        total_count:
          type: integer
          title: Total Count
      type: object
      required:
      - id
      - credits_used
      - credits_remaining
      - technologies
      - total_count
      title: GetTechnologiesResponse
    CategoryDetails:
      properties:
        slug:
          type: string
          title: Slug
        name:
          type: string
          title: Name
        name_short:
          type: string
          title: Name Short
        technologies:
          items:
            $ref: '#/components/schemas/Technology'
          type: array
          title: Technologies
          description: Technologies in the category. Technologies mentioned most often in job postings appear first.
      type: object
      required:
      - slug
      - name
      - name_short
      - technologies
      title: CategoryDetails
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    api_token:
      type: http
      scheme: bearer
