overlay: 1.0.0
info:
  title: API Evangelist enhancements for Sumble API
  version: 1.1.0
extends: openapi/_original/sumble-openapi-original.json
actions:
  - target: $.info
    update:
      x-apievangelist-enriched: '2026-08-13'
      x-apievangelist-auth: 'HTTP bearer API token (Authorization: Bearer)'
      x-apievangelist-rate-limit: '10 requests/second per user, aggregated across all endpoints; 429 when exceeded; no rate-limit response headers published'
      x-apievangelist-billing: 'credit-based; 402 on insufficient credits'
      x-apievangelist-mcp: 'https://mcp.sumble.com'
      x-apievangelist-mcp-auth: 'OAuth 2.0 authorization_code + PKCE S256, dynamic client registration'
      x-apievangelist-docs: 'https://docs.sumble.com/api/api'
      x-apievangelist-status-page: 'https://status.sumble.com'
      x-apievangelist-spec-url: 'https://api.sumble.com/openapi.json?version=v9'
  - target: $.info
    update:
      x-apievangelist-conventions: conventions/sumble-conventions.yml
      x-apievangelist-errors: errors/sumble-problem-types.yml
      x-apievangelist-data-model: data-model/sumble-data-model.yml
      x-apievangelist-authentication: authentication/sumble-authentication.yml
      x-apievangelist-rate-limits: rate-limits/sumble-rate-limits.yml
      x-apievangelist-plans: plans/sumble-plans-pricing.yml
      x-apievangelist-examples: examples/sumble-examples.yml
      x-apievangelist-tool-crosswalk: mcp/sumble-tool-crosswalk.yml
      x-apievangelist-skills: skills/_index.yml
      x-apievangelist-well-known: well-known/sumble-well-known.yml
  - target: $.info
    update:
      x-apievangelist-idempotency: >-
        Not supported. No Idempotency-Key contract is documented and none
        appears in the spec; a retried POST to a list-mutation endpoint may
        duplicate.
      x-apievangelist-sdks: >-
        None. Sumble publishes no first-party client library and documents
        openapi-generator against the published spec instead.
      x-apievangelist-agent-card: >-
        None served at /.well-known/agent-card.json or /.well-known/agent.json
        on any Sumble host.
  - target: $.servers
    update:
      description: The only supported base URL; sumble.com/paid-api/... paths are not public endpoints.
