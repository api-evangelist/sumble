aid: sumble
name: Sumble
description: >-
  Sumble provides account intelligence data that powers go-to-market work across
  the revenue org — sales, RevOps, marketing, and customer success. Its data
  captures the most detailed view of what companies use (technologies and
  projects), who works there (people, teams, job posts), and when they are ready
  to buy (signals). Sumble exposes this as a RESTful enrichment API (OpenAPI 3.1,
  bearer-token auth) plus a hosted MCP server, letting teams enrich CRM data,
  build lead-generation tools, and run market research programmatically. Surfaced
  as a portfolio company of Bloomberg Beta and enriched into the API Evangelist
  network from its public developer surface.
