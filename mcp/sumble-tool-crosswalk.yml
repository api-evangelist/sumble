mcp_only:
  - tool: RenameOrganizationList
    reason: >-
      No rename/update operation exists on /v9/organization-lists in the
      published spec. The MCP surface can rename a list; the REST surface
      cannot.
  - tool: ListSignalConfigs
    reason: >-
      Standing signal-rule configs are readable through MCP but have no
      published REST path in v9.
  - tool: RunSqlQuery
    reason: >-
      Read-only SQL against Sumble's DuckDB. There is no SQL endpoint in the
      REST API — this is an MCP-only escape hatch, and the single largest
      capability divergence between the two surfaces.
  - tool: ListTables
    reason: Schema introspection for the DuckDB surface exposed only through MCP.
  - tool: GetAccountInformation
    reason: 'Credit balance, API-key status, and plan info have no REST path in v9.'
  - tool: GetMyCompanyProfile
    reason: >-
      The caller's own company + target-account intelligence profile. MCP-only;
      it is what gives the server contextual awareness of the user's stack.
  - tool: ListDocumentation
    reason: Serves the docs site itself so the assistant answers from source rather than web search. Not an API capability.
  - tool: GetDocumentationPage
    reason: Serves one docs page by path. Not an API capability.
  - tool: GetOrganizationTechStack
    reason: >-
      Exposed as a first-class tool with its own credit price, but reached in
      REST only as a select-block projection of POST /v9/organizations rather
      than a distinct operation.
rest_only:
  - capability: teams
    operations: [find_teams__api_version__teams_post]
    note: >-
      POST /v9/teams is a first-class core-data endpoint in the REST docs
      (resolve or search teams, with ICP fit score, related people, and the
      team's job posts) and has NO corresponding MCP tool. Teams reach the
      agent surface only as a per-entity metric inside
      FindMatchAndEnrichOrganizations. This is the one real capability an
      agent loses by working through MCP instead of REST.
  - capability: organization signals (per-organization)
    operations: [get_organization_signals__api_version__organizations__organization_id__signals_get]
    note: >-
      GET /v9/organizations/{organization_id}/signals has no dedicated MCP
      tool; SearchSignals covers the same ground by organization_ids filter,
      so this is a shape difference rather than a missing capability.
