divergence_summary: >-
  The two surfaces are close but not identical. MCP is the larger surface: it
  adds account/self-service reads (GetAccountInformation,
  GetMyCompanyProfile), signal-rule introspection (ListSignalConfigs), a list
  rename REST does not offer, docs retrieval, and — most significantly — a
  raw read-only SQL escape hatch (RunSqlQuery/ListTables) over Sumble's DuckDB
  that has no REST equivalent at all. REST keeps one capability MCP does not
  expose at all — POST /v9/teams, the teams core-data endpoint — plus the
  per-organization signals path, which SearchSignals covers by filter.
version_drift:
  finding: >-
    Sumble's own published Agent Skills (github.com/SumbleData/sumble-skills-public)
    instruct agents to call POST /v6/organizations and POST /v6/people, while
    the current published spec and base path are v9. The skills are pinned to
    an API version three releases behind the contract Sumble publishes.
